# Checks a pull request: types, content, the production build and both Playwright suites.
# It never deploys. It runs for pull requests only — a plain push to a branch
# (redesign/v2 included) does not start it.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Feature tests against the Vite dev server (desktop + mobile).
      - name: Test (dev server)
        run: npm test

      # Prerender, deep-link, 404 and asset tests against dist/ served like GitHub Pages.
      - name: Test (production build)
        run: npm run test:build
        env:
          PW_SKIP_BUILD: '1' # dist/ was built above

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
