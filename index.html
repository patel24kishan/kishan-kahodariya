<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      /*
       * No-flash theme. Runs before the stylesheet and before first paint.
       * Contract (ARCHITECTURE.md section 5, shared with ThemeProvider in src/theme):
       *   localStorage["kk-theme"] = "dark" | "light"  → the visitor's explicit choice
       *   otherwise                                    → the system setting
       *   result                                       → <html data-theme="dark|light">
       * The two colours below are --color-canvas of each theme (src/styles/tokens.css).
       */
      (function () {
        var theme = '';
        try {
          var stored = window.localStorage.getItem('kk-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        } catch (storageBlocked) {}
        if (!theme) {
          try {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          } catch (noMatchMedia) {
            theme = 'dark';
          }
        }
        try {
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f5' : '#0a0a0a');
        } catch (ignored) {}
      })();
    </script>
    <style>
      /* Black cover for a first-time phone visitor, so the page never shows before the welcome popup. */
      html.kk-popup-pending::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        background: #000000;
      }
    </style>
    <!--kk:head-->
    <title>Kishan Kahodariya</title>
    <!--/kk:head-->
    <script>
      /*
       * Welcome-popup cover. Runs before first paint, after the managed head (which carries the
       * kk-popup marker when the popup is switched on in the dashboard). Mirrors the rules in
       * src/components/popup/WelcomePopup.tsx: a phone, the popup not seen yet (or ?popup=1).
       * The app lifts the cover (popupCover.ts); the timer lifts it if the app never starts.
       */
      (function () {
        try {
          if (!document.querySelector('meta[name="kk-popup"]')) return;
          if (!window.matchMedia('(max-width: 767px)').matches) return;
          var forced = /(^|[?&])popup=1(&|$)/.test(window.location.search);
          var seen = true;
          try {
            seen = window.localStorage.getItem('kk-welcome-seen') !== null;
          } catch (storageBlocked) {
            seen = false;
          }
          if (seen && !forced) return;
          var root = document.documentElement;
          root.classList.add('kk-popup-pending');
          window.setTimeout(function () {
            root.classList.remove('kk-popup-pending');
          }, 8000);
        } catch (ignored) {}
      })();
    </script>
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%favicon-64.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
  </head>
  <body>
    <div id="root"><!--kk:app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
