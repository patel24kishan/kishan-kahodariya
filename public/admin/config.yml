        required: true
        default: 0
        hint: *order_hint
      - name: orderSoftdev
        label: Position on the software page
        widget: number
        value_type: int
        required: true
        default: 0
        hint: *order_hint
      - name: published
        label: Published
        widget: boolean
        required: false
        default: false
        hint: *published_hint

  # =======================================================================================
  # Links — content/links/<slug>.json
  # =======================================================================================
  - name: links
    label: Links
    label_singular: Link
    icon: link
    description: GitHub, LinkedIn, YouTube, email… Each link can show next to your name (top of the page), in the footer, or both.
    folder: content/links
    format: json
    extension: json
    identifier_field: label
    slug:
      template: '{{fields.slug}}'
      editable: false
    duplicate: false
    summary: "{{label}} · {{audience}}{{published | ternary('', ' · DRAFT')}}"
    sortable_fields:
      fields: [label, order, orderFooter]
      default:
        field: order
        direction: ascending
    fields:
      - name: slug
        label: Short name (file name)
        widget: string
        required: true
        hint: *slug_hint
        pattern:
          - *slug_pattern
          - *slug_message
      - name: label
        label: Link text
        widget: string
        required: true
        hint: For example YouTube.
      - name: url
        label: Address
        widget: string
        required: false
        default: ''
        hint: The full address, for example `https://www.youtube.com/@yourchannel` — or `mailto:you@example.com` for email. A link with an empty address is not shown.
        pattern:
          - *link_pattern
          - *link_message
      - name: icon
        label: Icon
        widget: select
        required: true
        default: link
        options:
          - { label: GitHub, value: github }
          - { label: GitLab, value: gitlab }
          - { label: LinkedIn, value: linkedin }
          - { label: YouTube, value: youtube }
          - { label: itch.io, value: itchio }
          - { label: Steam, value: steam }
          - { label: Email, value: email }
          - { label: Blog, value: blog }
          - { label: X (Twitter), value: x }
          - { label: Discord, value: discord }
          - { label: Plain link, value: link }
      - name: audience
        label: Page
        widget: select
        required: true
        default: both
        options: *audience_options
        hint: The page(s) this link is shown on.
      - name: order
        label: Position next to your name
        widget: number
        value_type: int
        required: true
        default: 0
        hint: >-
          The order of the link buttons at the top of the page, next to your name. Lower
          numbers come first; leave gaps (10, 20, 30…). The footer has its own order below.
      - name: orderFooter
        label: Footer order
        widget: number
        value_type: int
        required: true
        default: 0
        hint: >-
          The order of the links in the footer, separate from the order at the top of the
          page. Lower numbers come first; leave gaps (10, 20, 30…).
      - name: showInHero
        label: Show next to your name (top of the page)
        widget: boolean
        required: false
        default: false
      - name: showInFooter
        label: Show in the footer
        widget: boolean
        required: false
        default: false
      - name: published
        label: Published
        widget: boolean
        required: false
        default: false
        hint: *published_hint

