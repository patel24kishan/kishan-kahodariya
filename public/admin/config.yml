        widget: list
        required: false
        default: []
        hint: One skill per row; drag to reorder.
      - name: emphasis
        label: Highlight on
        widget: select
        required: true
        default: none
        options:
          - { label: Game page, value: game }
          - { label: Software page, value: softdev }
